<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A222B" />
      <stop offset="100%" stop-color="#3D0B12" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CC" />
      <stop offset="50%" stop-color="#F2DEB9" />
      <stop offset="100%" stop-color="#C29848" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  
  <!-- Outer ornate gold border -->
  <rect x="32" y="32" width="448" height="448" rx="76" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6" />
  <rect x="44" y="44" width="424" height="424" rx="66" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4" />

  <!-- Center Magnolia Flower & Monogram Symbol -->
  <g transform="translate(256, 230)">
    <!-- Stylized Lotus / Magnolia petals -->
    <path d="M0 -110 C35 -70 65 -30 70 20 C50 65 15 85 0 85 C-15 85 -50 65 -70 20 C-65 -30 -35 -70 0 -110 Z" fill="url(#gold)" opacity="0.95" />
    <path d="M-50 -10 C-100 -30 -130 10 -110 50 C-80 90 -20 75 0 85 C-25 65 -50 40 -50 -10 Z" fill="url(#gold)" opacity="0.8" />
    <path d="M50 -10 C100 -30 130 10 110 50 C80 90 20 75 0 85 C25 65 50 40 50 -10 Z" fill="url(#gold)" opacity="0.8" />
    <!-- Diamond core -->
    <polygon points="0,-25 15,0 0,25 -15,0" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography: MAGNOLIA -->
  <text x="256" y="375" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="44" font-weight="bold" fill="url(#gold)" letter-spacing="8">MAGNOLIA</text>
  <text x="256" y="415" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#E5C07B" letter-spacing="6">RESTAURANT</text>
</svg>
